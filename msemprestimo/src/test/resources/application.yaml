spring:
  datasource:
    url: jdbc:h2:mem:msemprestimo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

resilience4j:
  circuitbreaker:
    instances:
      msequipamentoCondicao:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - com.msemprestimo.excecao.RecursoNaoEncontradoException
          - com.msemprestimo.excecao.ConflitoException
          - com.msemprestimo.excecao.RequisicaoInvalidaException
